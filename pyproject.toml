[project]
name = "greek"
version = "0.1.0"
description = "Base de datos relacional de mitologia griega en SQLite, a partir de datasets academicos abiertos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "rdflib>=7.0",
    "numpy>=2.4.6",
    "neo4j>=6.2.0",
]

[project.scripts]
greek = "greek.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greek"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
